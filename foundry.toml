[profile.default]
bytecode_hash = "none"
evm_version = "cancun"
libs = ["lib"]
out = "out"
optimizer = true
optimizer_runs = 200
solc_version = "0.8.30"
src = "src"
via_ir = true
# The real-flow replay reads a recorded price path, and replays tens of thousands of swaps in one test.
fs_permissions = [{ access = "read", path = "./test/data" }]
gas_limit = "18446744073709551615"

[profile.default.invariant]
runs = 24
depth = 80
fail_on_revert = false
